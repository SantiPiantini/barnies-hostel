version: '3.1'

services:
  postgres:
    image: postgres:15.2
    container_name: hostel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uda
      POSTGRES_PASSWORD: uda123
      POSTGRES_DB: hostelDB
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always